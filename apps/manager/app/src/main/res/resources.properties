# The locale of the unqualified res/values resources.
#
# `androidResources.generateLocaleConfig = true` builds the per-app language list from
# the res qualifiers, and it needs to be told what the unqualified folder actually is:
# res/values/strings.xml here is Simplified Chinese, not a neutral fallback, so leaving
# this out (or claiming `en`) would offer the wrong default language in the system's
# per-app language picker.
unqualifiedResLocale=zh-CN
