# Builds the signed release artifacts, publishes them, and posts them to Telegram.
#
# Two artifacts, and they are a matched pair: the daemon authenticates the manager by the
# signing certificate pinned inside the module at install time, so a module zip only trusts
# the APK built alongside it. cch-packager derives the pin from the APK it is handed, which
# is why the APK is built first and passed in rather than the pin being written by hand.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The tag names the release; version.properties is what both halves compile against.
      # If they disagree the artifacts would report a version nobody asked for, so this
      # fails before anything is built rather than after it is published.
      - name: Check the tag against version.properties
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          declared=$(sed -n 's/^version=//p' version.properties)
          if [ "${tag#v}" != "$declared" ]; then
            echo "::error::tag $tag does not match version.properties ($declared)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # One NDK for all three ABIs; the packager finds it through ANDROID_NDK_HOME.
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28

      - name: Add the Android Rust targets
        run: |
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      # The keystore never lives in the repository. It arrives base64-encoded in a secret,
      # is written outside the checkout, and keystore.properties is generated to point at
      # it — the same file a local build uses, so both paths sign identically.
      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set — a release must be signed with the pinned key."
            exit 1
          fi
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          cat > apps/manager/keystore.properties <<PROPERTIES
          storeFile=$keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES

      - name: Build the manager APK
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo run --release -p cch_packager -- manager-apk

      # Derives the pin from that APK's certificate, cross-compiles the daemon for all
      # three ABIs, compiles the bridge DEX, and assembles the zip.
      - name: Build the module
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo run --release -p cch_packager -- module --manager-apk dist/crashcatcher.apk

      - name: Name the artifacts after the tag
        id: artifacts
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          mv dist/crashcatcher.apk "dist/CrashCatcher-$version.apk"
          mv dist/crashcatcher-module.zip "dist/CrashCatcher-module-$version.zip"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=dist/CrashCatcher-$version.apk" >> "$GITHUB_OUTPUT"
          echo "module=dist/CrashCatcher-module-$version.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: crashcatcher-${{ steps.artifacts.outputs.version }}
          path: dist/*

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.artifacts.outputs.tag }}" \
            "${{ steps.artifacts.outputs.module }}" \
            "${{ steps.artifacts.outputs.apk }}" \
            --title "CrashCatcher ${{ steps.artifacts.outputs.version }}" \
            --generate-notes \
            --verify-tag

      # Both files in one message, so the pair cannot be downloaded half-and-half — a
      # module and an APK from different builds do not trust each other.
      - name: Post to Telegram
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          VERSION: ${{ steps.artifacts.outputs.version }}
          MODULE: ${{ steps.artifacts.outputs.module }}
          APK: ${{ steps.artifacts.outputs.apk }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "::warning::Telegram credentials are not set; skipping the channel post."
            exit 0
          fi
          read -r -d '' caption <<CAPTION || true
          *CrashCatcher $VERSION*

          记录应用崩溃、ANR 与原生崩溃。刷入模块后安装同一次构建的管理器 —— 守护进程只信任
          与模块内 pin 相同签名的 APK。

          [更新日志](https://github.com/${{ github.repository }}/releases/tag/${{ steps.artifacts.outputs.tag }})
          CAPTION
          curl -sS --fail-with-body \
            -X POST "https://api.telegram.org/bot$TOKEN/sendMediaGroup" \
            -F "chat_id=$CHAT" \
            -F "media=[{\"type\":\"document\",\"media\":\"attach://module\",\"caption\":$(jq -Rs . <<< "$caption"),\"parse_mode\":\"Markdown\"},{\"type\":\"document\",\"media\":\"attach://apk\"}]" \
            -F "module=@$MODULE" \
            -F "apk=@$APK"
