# Checks, builds and publishes.
#
# Two axes keep this short:
#
# - **Scoped.** The manager APK and the root module are independent artifacts, so a
#   Kotlin-only commit does not cross-compile three daemon ABIs and a daemon-only commit does
#   not spend three minutes in R8. Both halves are built together only when
#   `cch_wire::PROTOCOL_VERSION` moves — that constant is bumped exactly when one side needs
#   the other updated with it, which makes it the signal, rather than any edit under
#   `crates/cch_wire` (a comment or a daemon-only DTO changes nothing the manager depends on).
# - **Parallel.** Checks, APK and module are three jobs that do not wait on each other, so
#   the wall clock is the slowest one rather than their sum. Publishing collects whatever the
#   build actually produced.
#
# Full ABI coverage costs three cross-compiles and only matters for something people install,
# so day-to-day pushes build arm64 alone and a tag builds all three.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      manager: ${{ steps.decide.outputs.manager }}
      apk: ${{ steps.decide.outputs.apk }}
      module: ${{ steps.decide.outputs.module }}
      abi: ${{ steps.decide.outputs.abi }}
    steps:
      # Full history: the range below is diffed with git, and a shallow clone cannot see where
      # the push started.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Which range to look at.
      #
      # The whole push, not its tip. A push carrying "fix the daemon" then "tweak a screen"
      # would otherwise be judged on the screen alone and ship no module — the packages would
      # silently fall out of step with the commits inside them.
      #
      # Anything that makes the range unreadable falls back to building both halves. A missed
      # package is a release quietly lacking a fix; an extra package costs a few minutes of
      # CI. The cases: a brand-new branch has no `before`, a force-push leaves a `before` that
      # is no longer an ancestor, and a garbage-collected `before` cannot be read at all.
      - name: Resolve the comparison range
        id: range
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          emit() {
            echo "base=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$2" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            emit "${{ github.base_ref }}" "pull request against ${{ github.base_ref }}"
          fi
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            emit "" "tag build, everything"
          fi
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            emit "" "no before commit, everything"
          fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            emit "" "before commit is unreachable, everything"
          fi
          if ! git merge-base --is-ancestor "$BEFORE" "${{ github.sha }}"; then
            emit "" "history was rewritten, everything"
          fi
          emit "$BEFORE" "$(git rev-list --count "$BEFORE..${{ github.sha }}") commit(s) since ${BEFORE:0:7}"

      - uses: dorny/paths-filter@v4
        id: filter
        if: steps.range.outputs.base != ''
        with:
          base: ${{ steps.range.outputs.base }}
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'clippy.toml'
              - 'rust-toolchain.toml'
            bridge:
              - 'bridge/**'
            module:
              - 'module/**'
            manager:
              - 'apps/manager/**'
            everything:
              - 'version.properties'
              - '.github/**'

      # Did the protocol version move?
      #
      # This, and not "did anything under crates/cch_wire change", is what forces both halves.
      # The constant is bumped exactly when one side needs the other updated with it, so it is
      # the one honest signal for "these two must ship together" — while a comment, a new DTO
      # only the daemon reads, or a test vector touches that directory without changing
      # anything the manager depends on.
      - name: Check the protocol version
        id: protocol
        if: steps.range.outputs.base != ''
        run: |
          file=crates/cch_wire/src/frame.rs
          current=$(sed -n 's/^pub const PROTOCOL_VERSION: u32 = \([0-9]*\);/\1/p' "$file")
          previous=$(git show "${{ steps.range.outputs.base }}:$file" 2>/dev/null \
            | sed -n 's/^pub const PROTOCOL_VERSION: u32 = \([0-9]*\);/\1/p')
          # An unreadable old value means the file is new or moved — treat that as a change
          # rather than assuming it held still.
          if [ -z "$previous" ] || [ "$previous" != "$current" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::protocol ${previous:-unknown} → $current, building both halves"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Written as `if` blocks on purpose: the step runs under `bash -e`, where a trailing
      # `[ x ] && y=true` exits non-zero the moment the test is false and fails the job.
      - name: Decide what to build
        id: decide
        env:
          WIRE: ${{ steps.protocol.outputs.changed }}
          RUST: ${{ steps.filter.outputs.rust }}
          BRIDGE: ${{ steps.filter.outputs.bridge }}
          MODULE: ${{ steps.filter.outputs.module }}
          MANAGER: ${{ steps.filter.outputs.manager }}
          EVERYTHING: ${{ steps.filter.outputs.everything }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          all=false
          # No usable range means the filter never ran and nothing was ruled out.
          if [ -z "${{ steps.range.outputs.base }}" ]; then all=true; fi
          if [ "$WIRE" = "true" ] || [ "$EVERYTHING" = "true" ]; then all=true; fi

          apk=$all
          module=$all
          if [ "$MANAGER" = "true" ]; then apk=true; fi
          if [ "$RUST" = "true" ] || [ "$BRIDGE" = "true" ] || [ "$MODULE" = "true" ]; then
            module=true
          fi

          abi=arm64-v8a
          if [ "$IS_TAG" = "true" ]; then abi=arm64-v8a,armeabi-v7a,x86_64; fi

          {
            echo "rust=${RUST:-$all}"
            echo "manager=${MANAGER:-$all}"
            echo "apk=$apk"
            echo "module=$module"
            echo "abi=$abi"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::${{ steps.range.outputs.reason }} → apk=$apk module=$module abi=$abi"

  checks:
    name: Rust checks
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Its own cache slot: these are debug/test artifacts, and sharing a slot with the
      # release cross-builds below would have the two evicting each other every run.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks

      - name: Format
        run: cargo fmt --all --check

      # clippy.toml denies unwrap/expect/panic in this workspace: the daemon runs as root on
      # someone's phone, and a panic there stops crash recording with nothing to show for it.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  apk:
    name: Manager APK
    needs: scope
    if: needs.scope.outputs.apk == 'true'
    runs-on: ubuntu-latest
    steps:
      # versionCode is the commit count, and a shallow clone counts 1.
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - uses: ./.github/actions/signing
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}

      # One Gradle invocation for the tests and the APK: a second one pays for configuration,
      # dependency resolution and a cold daemon all over again.
      - name: Test and assemble
        working-directory: apps/manager
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Name the artifact
        run: |
          mkdir -p dist
          suffix="$(sed -n 's/^version=//p' version.properties)-r$(git rev-list --count HEAD)"
          cp apps/manager/app/build/outputs/apk/release/*.apk "dist/CrashCatcher-$suffix.apk"
          ls -1 dist/

      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: dist/*
          if-no-files-found: error

  module:
    name: Root module
    needs: scope
    if: needs.scope.outputs.module == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: module
          # The cross-compiled targets live here, and the key has to change with the ABI set
          # or a tag build would restore an arm64-only cache and rebuild the other two anyway.
          key: ${{ needs.scope.outputs.abi }}

      - uses: ./.github/actions/signing
        id: signing
        with:
          keystore-base64: ${{ secrets.KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.KEY_ALIAS }}
          key-password: ${{ secrets.KEY_PASSWORD }}

      # The pin comes from the keystore, not from an APK: this job does not build one, and the
      # certificate is the same either way. That is what lets the two package jobs run in
      # parallel instead of the module waiting on R8.
      - name: Build the module
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo run --release -p cch_packager -- module \
            --manager-cert-sha256 "${{ steps.signing.outputs.pin }}" \
            --abi "${{ needs.scope.outputs.abi }}"

      - name: Name the artifact
        run: |
          suffix="$(sed -n 's/^version=//p' version.properties)-r$(git rev-list --count HEAD)"
          mv dist/crashcatcher-module.zip "dist/CrashCatcher-module-$suffix.zip"
          ls -1 dist/

      - uses: actions/upload-artifact@v7
        with:
          name: module
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [scope, checks, apk, module]
    # Tolerates the jobs that were skipped, but not one that actually failed.
    if: |
      always() && github.event_name != 'pull_request' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
      (needs.apk.result == 'success' || needs.module.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: dist

      - name: Post to the channel
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: bash .github/scripts/post-telegram.sh

      # Only a tag becomes a release, and only a release moves update.json — the root manager
      # polls it, and pointing it at a per-push build would offer everyone an update to
      # whatever landed on main five minutes ago.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          name: CrashCatcher ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Point update.json at it
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/update-json.sh
