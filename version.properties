# The single source of the release version.
#
# Read by the manager's Gradle build (versionName, and versionCode derived from it) and by
# cch-packager when it writes module.prop, so one edit moves the APK and the module
# together. They cannot be allowed to drift: the module and the manager are shipped as a
# matched pair, and a user comparing "崩溃捕手 0.1.0" in the root manager against 0.2.0 in
# the about page has no way to tell which half is stale.
#
# The release workflow refuses to build when the tag disagrees with this value.
version=0.1.0
