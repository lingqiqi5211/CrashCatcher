# The single source of the release version *name*.
#
# Read by the manager's Gradle build and by cch-packager when it writes module.prop, so one
# edit moves the APK and the module together. They cannot be allowed to drift: the module
# and the manager are shipped as a matched pair, and a user comparing "崩溃捕手 0.1.0" in the
# root manager against 0.2.0 in the about page has no way to tell which half is stale.
#
# versionCode is *not* here — it is the commit count, derived by both halves, so there is no
# second number to bump.
#
# The workflow refuses to build a tag that disagrees with this value.
version=0.3.0
